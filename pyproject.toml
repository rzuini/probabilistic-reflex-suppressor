[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-reflex-suppressor"
version = "0.1.0"
description = "Count people in an image while auditing likely mirror reflections."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
probabilistic-reflex-suppressor = "probabilistic_reflex_suppressor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_generics = true
ignore_missing_imports = true
follow_imports = "skip"
packages = ["probabilistic_reflex_suppressor"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=probabilistic_reflex_suppressor --cov-report=term-missing"
testpaths = ["tests"]
